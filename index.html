<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f2418">
  <title>Xylem — Smart Farm</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div id="app-container">
    <aside class="sidebar">
      <div>
        <div class="brand"><span class="brand-mark">✳</span><div><strong>XYLEM</strong><small>SMART FARM OS</small></div></div>
        <div class="farm-switch"><span class="live-dot"></span><div><small>ACTIVE FARM</small><strong>Aisha's Garden</strong></div><span>⌄</span></div>
        <nav class="nav-menu">
          <button class="nav-item active" data-view="dashboard"><span>⌂</span> Overview</button>
          <button class="nav-item" data-view="plants"><span>♧</span> My Plants</button>
          <button class="nav-item" data-view="analytics"><span>⌁</span> Sensor Data</button>
          <button class="nav-item" data-view="settings"><span>⚙</span> Settings</button>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <div class="connection"><span class="live-dot"></span><div><strong>Systems online</strong><small>3 micro:bit nodes connected</small></div></div>
        <button id="btnSignout" class="sign-out">Sign out</button>
      </div>
    </aside>

    <main id="mainViewContainer">
      <section id="page-dashboard" class="view-page active-page"></section>
      <section id="page-plants" class="view-page"></section>
      <section id="page-analytics" class="view-page"></section>
      <section id="page-settings" class="view-page"></section>
    </main>
  </div>

  <div class="modal-overlay" id="plantModal">
    <div class="modal-content">
      <button class="close-modal" id="btnCloseModal">×</button>
      <div id="plantModalBody"></div>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
